openapi: 3.1.0
info:
  title: ПУЛЬС — собственный студенческий API
  version: 1.0.0
  description: Публичная граница веб-клиент ↔ собственный сервер. Все сведения
    вымышлены; реальные университетские системы не подключаются. Сервер
    определяет студента только по cookie; учебные записи доступны только для
    чтения.
servers:
  - url: /api/v1
    description: Same-origin API сервера ПУЛЬС
tags:
  - name: Авторизация
    description: Сессия текущего студента
  - name: Главная
    description: Сводка с частичной доступностью
  - name: Учебный контекст
    description: Периоды и подтверждённая принадлежность
  - name: Расписание
    description: План, факт и посещаемость
  - name: Учебная деятельность
    description: Работы, результаты и самостоятельные единицы
  - name: Поиск
    description: По всем подтверждённым периодам
  - name: Материалы
    description: Безопасные ссылки и защищённые файлы
  - name: Заявки
    description: Собственные заявления и справки
  - name: Обращения
    description: Собственные сообщения
  - name: Уведомления
    description: Пять категорий и прочтение
  - name: Объявления
    description: Полные доступные публикации
  - name: Календарь
    description: Единая выборка и экспорт
  - name: Помощник
    description: ИИ только для чтения
security:
  - sessionCookie: []
paths:
  /auth/login:
    post:
      tags:
        - Авторизация
      operationId: loginStudent
      summary: Войти в демонстрационный аккаунт
      description: После успеха выдаётся новая непрозрачная серверная cookie, исходный
        пароль не возвращается. При неверной паре — одинаковый 401 без раскрытия
        аккаунта.
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                login:
                  type: string
                  maxLength: 120
                  minLength: 1
                password:
                  type: string
                  maxLength: 256
                  minLength: 1
              additionalProperties: false
              required:
                - login
                - password
      responses:
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
              example:
                data:
                  displayName: Студент А (демо)
                  expiresAt: '2026-11-11T21:15:00+06:00'
                  absoluteExpiresAt: '2026-11-18T09:15:00+06:00'
                meta:
                  requestId: http-login-001
          headers:
            Set-Cookie:
              description: __Host-puls_session=<непрозрачное значение>; Path=/; Secure;
                HttpOnly; SameSite=Lax
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
              description: private, no-store
            Vary:
              description: Изоляция cookie или внутреннего сервисного контекста
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '401':
          $ref: '#/components/responses/Unauthorized'
      security: []
      x-trace-scenarios:
        - СЦ-01
        - СЦ-02
        - СЦ-15
      x-read-only-academic-data: false
  /auth/logout:
    post:
      tags:
        - Авторизация
      operationId: logoutStudent
      summary: Отозвать собственную сессию
      description: Повторный выход безопасен; тело запроса отсутствует. 204 также
        после уже завершённого выхода при корректном Origin, без раскрытия
        сведений аккаунта.
      parameters:
        - $ref: '#/components/parameters/Origin'
      responses:
        '204':
          description: Сессия отозвана; cookie очищена
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Удалить cookie с теми же атрибутами
            Cache-Control:
              description: Персональные и учебные ответы не кэшировать
              schema:
                type: string
                const: private, no-store
            Vary:
              description: Изоляция cookie или внутреннего сервисного контекста
              schema:
                type: string
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
      security: []
      x-trace-scenarios:
        - СЦ-01
        - СЦ-02
        - СЦ-15
      x-read-only-academic-data: false
  /auth/me:
    get:
      tags:
        - Авторизация
      operationId: getSession
      summary: Получить состояние текущей сессии
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
          headers:
            Cache-Control:
              description: Персональные и учебные ответы не кэшировать
              schema:
                type: string
                const: private, no-store
            Vary:
              description: Изоляция cookie или внутреннего сервисного контекста
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-trace-scenarios:
        - СЦ-01
        - СЦ-02
        - СЦ-15
      x-read-only-academic-data: false
  /profile:
    get:
      tags:
        - Авторизация
      operationId: getMyProfile
      summary: Собственный профиль студента
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
          headers:
            Cache-Control:
              description: Персональные и учебные ответы не кэшировать
              schema:
                type: string
                const: private, no-store
            Vary:
              description: Изоляция cookie или внутреннего сервисного контекста
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-trace-scenarios:
        - СЦ-01
        - СЦ-02
        - СЦ-15
      x-read-only-academic-data: false
  /dashboard:
    get:
      tags:
        - Главная
      operationId: getDashboard
      summary: Персональная сводка
      description: При отказе одного источника — 200 с достоверными частями и
        meta.sourceStatus=PARTIAL, не «всё пусто».
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
          headers:
            Cache-Control:
              description: Персональные и учебные ответы не кэшировать
              schema:
                type: string
                const: private, no-store
            Vary:
              description: Изоляция cookie или внутреннего сервисного контекста
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'
      x-trace-scenarios:
        - СЦ-03
        - СЦ-16
      x-read-only-academic-data: false
  /periods:
    get:
      tags:
        - Учебный контекст
      operationId: listPeriods
      summary: Разрешённые учебные периоды
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeriodListResponse'
          headers:
            Cache-Control:
              description: Персональные и учебные ответы не кэшировать
              schema:
                type: string
                const: private, no-store
            Vary:
              description: Изоляция cookie или внутреннего сервисного контекста
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'
      x-trace-scenarios:
        - СЦ-04
        - СЦ-06
        - СЦ-19
      x-read-only-academic-data: true
  /periods/{periodId}/offerings:
    get:
      tags:
        - Учебный контекст
      operationId: listOfferings
      summary: Список изучаемых дисциплин периода
      description: Каждый offering подтверждён membership; официальная подгруппа
        назначается только для этого offering.
      parameters:
        - $ref: '#/components/parameters/PeriodId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferingListResponse'
          headers:
            Cache-Control:
              description: Персональные и учебные ответы не кэшировать
              schema:
                type: string
                const: private, no-store
            Vary:
              description: Изоляция cookie или внутреннего сервисного контекста
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'
      x-trace-scenarios:
        - СЦ-04
        - СЦ-06
        - СЦ-19
      x-read-only-academic-data: true
  /periods/{periodId}/academic-units:
    get:
      tags:
        - Учебный контекст
      operationId: listAcademicUnits
      summary: Самостоятельные учебные единицы периода
      description: Включает самостоятельную курсовую без фиктивного offeringId.
      parameters:
        - $ref: '#/components/parameters/PeriodId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnitListResponse'
          headers:
            Cache-Control:
              description: Персональные и учебные ответы не кэшировать
              schema:
                type: string
                const: private, no-store
            Vary:
              description: Изоляция cookie или внутреннего сервисного контекста
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'
      x-trace-scenarios:
        - СЦ-04
        - СЦ-06
        - СЦ-19
      x-read-only-academic-data: true
  /periods/{periodId}/academic-units/{unitId}:
    get:
      tags:
        - Учебная деятельность
      operationId: getAcademicUnit
      summary: Подробность самостоятельной учебной единицы
      parameters:
        - $ref: '#/components/parameters/PeriodId'
        - $ref: '#/components/parameters/UnitId'
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnitDetailResponse'
          headers:
            Cache-Control:
              description: Персональные и учебные ответы не кэшировать
              schema:
                type: string
                const: private, no-store
            Vary:
              description: Изоляция cookie или внутреннего сервисного контекста
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'
      x-trace-scenarios:
        - СЦ-06
        - СЦ-07
        - СЦ-19
        - СЦ-20
        - СЦ-21
        - СЦ-22
        - СЦ-23
        - СЦ-24
      x-read-only-academic-data: true
  /schedule:
    get:
      tags:
        - Расписание
      operationId: getSchedule
      summary: Расписание на выбранный период
      description: Фильтрация строго по собственному назначению; предел диапазона 31
        день. Отмена и перенос являются состояниями той же записи.
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleListResponse'
          headers:
            Cache-Control:
              description: Персональные и учебные ответы не кэшировать
              schema:
                type: string
                const: private, no-store
            Vary:
              description: Изоляция cookie или внутреннего сервисного контекста
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'
      x-trace-scenarios:
        - СЦ-05
        - СЦ-20
      x-read-only-academic-data: true
  /schedule/{scheduleId}:
    get:
      tags:
        - Расписание
      operationId: getScheduleEntry
      summary: План занятия, факт и персональная посещаемость
      description: actual и attendance — разные, независимые факты; обязательные
        actualState/attendanceState отражают неизвестность или ошибку.
      parameters:
        - $ref: '#/components/parameters/ScheduleId'
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleDetailResponse'
          headers:
            Cache-Control:
              description: Персональные и учебные ответы не кэшировать
              schema:
                type: string
                const: private, no-store
            Vary:
              description: Изоляция cookie или внутреннего сервисного контекста
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'
      x-trace-scenarios:
        - СЦ-05
        - СЦ-20
      x-read-only-academic-data: true
  /periods/{periodId}/offerings/{offeringId}:
    get:
      tags:
        - Учебная деятельность
      operationId: getOfferingDetail
      summary: Подробность дисциплины в конкретном семестре
      description: Учебная активность, выполнение и результат — самостоятельные линии.
        Только проверенная принадлежность.
      parameters:
        - $ref: '#/components/parameters/PeriodId'
        - $ref: '#/components/parameters/OfferingId'
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferingDetailResponse'
          headers:
            Cache-Control:
              description: Персональные и учебные ответы не кэшировать
              schema:
                type: string
                const: private, no-store
            Vary:
              description: Изоляция cookie или внутреннего сервисного контекста
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'
      x-trace-scenarios:
        - СЦ-06
        - СЦ-07
        - СЦ-19
        - СЦ-20
        - СЦ-21
        - СЦ-22
        - СЦ-23
        - СЦ-24
      x-read-only-academic-data: true
  /periods/{periodId}/offerings/{offeringId}/sessions:
    get:
      tags:
        - Учебная деятельность
      operationId: listOfferingSessions
      summary: Занятия дисциплины, проведение и посещаемость
      parameters:
        - $ref: '#/components/parameters/PeriodId'
        - $ref: '#/components/parameters/OfferingId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionListResponse'
          headers:
            Cache-Control:
              description: Персональные и учебные ответы не кэшировать
              schema:
                type: string
                const: private, no-store
            Vary:
              description: Изоляция cookie или внутреннего сервисного контекста
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'
      x-trace-scenarios:
        - СЦ-06
        - СЦ-07
        - СЦ-19
        - СЦ-20
        - СЦ-21
        - СЦ-22
        - СЦ-23
        - СЦ-24
      x-read-only-academic-data: true
  /periods/{periodId}/offerings/{offeringId}/works:
    get:
      tags:
        - Учебная деятельность
      operationId: listOfferingWorks
      summary: Выданные работы дисциплины
      description: Пагинация полных серверно разрешённых данных, а не фильтрация
        первой загруженной страницы.
      parameters:
        - $ref: '#/components/parameters/PeriodId'
        - $ref: '#/components/parameters/OfferingId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkListResponse'
          headers:
            Cache-Control:
              description: Персональные и учебные ответы не кэшировать
              schema:
                type: string
                const: private, no-store
            Vary:
              description: Изоляция cookie или внутреннего сервисного контекста
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'
      x-trace-scenarios:
        - СЦ-06
        - СЦ-07
        - СЦ-19
        - СЦ-20
        - СЦ-21
        - СЦ-22
        - СЦ-23
        - СЦ-24
      x-read-only-academic-data: true
  /periods/{periodId}/offerings/{offeringId}/works/{workId}:
    get:
      tags:
        - Учебная деятельность
      operationId: getOfferingWork
      summary: Работа, подтверждённые этапы, выполнение и результаты
      parameters:
        - $ref: '#/components/parameters/PeriodId'
        - $ref: '#/components/parameters/OfferingId'
        - $ref: '#/components/parameters/WorkId'
        - name: stageRef
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 240
          description: Проверенная прямая ссылка к этапу данной работы, если этап
            действительно существует. Чужой или неверный ID — 404.
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkDetailResponse'
          headers:
            Cache-Control:
              description: Персональные и учебные ответы не кэшировать
              schema:
                type: string
                const: private, no-store
            Vary:
              description: Изоляция cookie или внутреннего сервисного контекста
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'
      x-trace-scenarios:
        - СЦ-06
        - СЦ-07
        - СЦ-19
        - СЦ-20
        - СЦ-21
        - СЦ-22
        - СЦ-23
        - СЦ-24
      x-read-only-academic-data: true
  /periods/{periodId}/offerings/{offeringId}/timeline:
    get:
      tags:
        - Учебная деятельность
      operationId: getOfferingTimeline
      summary: Хронология академической активности
