components:
  securitySchemes:
    internalServiceToken:
      type: apiKey
      in: header
      name: X-Internal-Token
      description: Доверенный машинный ключ из защищённой серверной конфигурации. Ни в браузер, ни в репозиторий
        не передавать.
  schemas:
    ErrorDetail:
      type: object
      properties:
        field:
          type: string
          maxLength: 160
        issue:
          type: string
          maxLength: 240
      additionalProperties: false
      required:
      - field
      - issue
    ErrorObject:
      type: object
      properties:
        code:
          type: string
          maxLength: 100
          minLength: 1
        message:
          type: string
          maxLength: 300
          minLength: 1
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
          maxItems: 30
      additionalProperties: false
      required:
      - code
      - message
    ErrorMeta:
      type: object
      properties:
        requestId:
          type: string
          description: Непрозрачный идентификатор, не доказывает право доступа
          maxLength: 240
          minLength: 1
      additionalProperties: false
      required:
      - requestId
    ErrorResponse:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ErrorObject'
        meta:
          $ref: '#/components/schemas/ErrorMeta'
      additionalProperties: false
      required:
      - error
      - meta
    AcademicDate:
      type: object
      properties:
        precision:
          type: string
          enum:
          - DATE_ONLY
          - DATE_TIME
        'on':
          type: string
          format: date
        at:
          type: string
          format: date-time
        timeZone:
          type: string
          description: IANA zone, только если есть достоверная зона источника
          maxLength: 100
      additionalProperties: false
      required:
      - precision
      description: При DATE_ONLY заполняется on, при DATE_TIME — at и время по ISO с offset; никакого вымышленного
        часа.
      oneOf:
      - properties:
          precision:
            const: DATE_ONLY
        required:
        - precision
        - 'on'
        not:
          anyOf:
          - required:
            - at
          - required:
            - timeZone
      - properties:
          precision:
            const: DATE_TIME
        required:
        - precision
        - at
        - timeZone
        not:
          required:
          - 'on'
    AssessmentValue:
      type: object
      properties:
        kind:
          type: string
          enum:
          - NUMERIC
          - TEXT
          - CODE
        numeric:
          type: string
          description: Точная десятичная строка, включая подтверждённый 0
          pattern: ^-?\d+(?:\.\d+)?$
        text:
          type: string
        code:
          type: string
        rawValueText:
          type: string
      additionalProperties: false
      required:
      - kind
      oneOf:
      - properties:
          kind:
            const: NUMERIC
        required:
        - kind
        - numeric
        not:
          anyOf:
          - required:
            - text
          - required:
            - code
      - properties:
          kind:
            const: TEXT
        required:
        - kind
        - text
        not:
          anyOf:
          - required:
            - numeric
          - required:
            - code
      - properties:
          kind:
            const: CODE
        required:
        - kind
        - code
        not:
          anyOf:
          - required:
            - numeric
          - required:
            - text
    CertificateData:
      type: object
      properties:
        copies:
          type: integer
          minimum: 1
          maximum: 5
        presentationPlace:
          type: string
          maxLength: 160
        comment:
          type: string
          maxLength: 500
      additionalProperties: false
      required:
      - copies
    ApplicationData:
