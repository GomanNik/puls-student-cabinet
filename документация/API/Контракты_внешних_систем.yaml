          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestOperationStatus'
              example:
                sourceCode: DEMO_UNIVERSITY
                operationId: 00000000-0000-4000-8000-000000000001
                correlationId: request-local-1
                externalOperationId: remote-op-1
                transportState: ACKNOWLEDGED
                alreadyProcessed: false
                businessStatus: SUBMITTED
                sourceRevision: rev-op-1
                transitions:
                - eventOccurrenceKey: accepted-1
                  businessStatus: SUBMITTED
                  occurredAt: '2026-11-11T09:00:00+06:00'
                  sourceRevision: rev-op-1
          headers:
            Cache-Control:
              description: Персональные и учебные ответы не кэшировать
              schema:
                type: string
                const: private, no-store
            Vary:
              description: Изоляция cookie или внутреннего сервисного контекста
