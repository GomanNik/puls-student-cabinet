        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          description: Конфликт удалённого operationId с иным payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalError'
              example:
                error:
