openapi: 3.1.0
info:
  title: ПУЛЬС — контракты закрытых тестовых университетских источников
  version: 1.0.0
  description: Исключительно server-to-server fixture API. Нет публичного ingress и нет доступа из браузера. Данные
    и идентичность вымышлены; Student API отдельно валидирует ACL и не возвращает клиенту сырые ExternalRef/sourceCode.
servers:
- url: http://university-fixture:8081/mock/v1
  description: Только приватная Docker-сеть; имя демонстрационное и не является публичным адресом
tags:
- name: Контекст
  description: Identity, membership и официальная подгруппа
- name: Занятия
  description: План, изменения, проведение, посещаемость
- name: Учебная деятельность
  description: Работы, этапы, результаты, аттестации
- name: Материалы
  description: Связи, метаданные и поток файла
- name: Информация
  description: Объявления, события, сроки
- name: Документооборот
  description: Идемпотентные команды заявок
- name: Переписка
  description: Идемпотентные обращения/реплики и демо-ответы
security:
- internalServiceToken: []
paths:
  /students/{externalStudentId}/context:
    get:
      tags:
      - Контекст
      operationId: readStudentContext
      summary: Периоды, привязки и профильную аудиторию одного вымышленного студента
      description: Сервер разрешает externalStudentId только через защищённое соответствие аккаунта.
      parameters:
      - $ref: '#/components/parameters/ExternalStudentId'
      responses:
        '200':
          description: Успешная серверная операция
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextRead'
              example:
                sourceCode: DEMO_UNIVERSITY
                requestedScope:
                  externalStudentId: student-A
                availability: OK
                isComplete: true
                fetchedAt: '2026-11-11T09:00:00+06:00'
                sourceRevision: rev-context-A-2
                items:
                - ref:
                    sourceCode: DEMO_UNIVERSITY
                    objectKind: STUDENT_CONTEXT
                    externalId: student-A
                  externalStudentId: student-A
                  periods:
                  - ref:
                      sourceCode: DEMO_UNIVERSITY
                      objectKind: ACADEMIC_PERIOD
                      externalId: fall-26
                    periodId: fall-26
                    label: Осень 2026
                  memberships:
                  - membershipRef:
                      sourceCode: DEMO_UNIVERSITY
                      objectKind: MEMBERSHIP
                      externalId: m-A-01
                    externalStudentId: student-A
                    periodId: fall-26
                    offeringId: math-101
                    state: CONFIRMED
          headers:
            Cache-Control:
              description: Персональные и учебные ответы не кэшировать
              schema:
                type: string
                const: private, no-store
            Vary:
              description: Изоляция cookie или внутреннего сервисного контекста
              schema:
                type: string
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '503':
          $ref: '#/components/responses/503'
        '504':
          $ref: '#/components/responses/504'
      x-server-to-server-only: true
